# Headers for every Evra page (included by each server in nginx.conf).

# Browsers check every file with the server on each load (a quick "not changed"
# when it isn't), so an update shows straight away.
add_header Cache-Control "no-cache" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
