# Evra's web server inside the add-on.
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;

  # Content Security Policy: only Evra's own scripts may run (no inline or
  # injected ones), so a bug that lets text into the page can't run code or
  # steal the Home Assistant sign-in. Connections, pictures and camera video may
  # go to any address: Home Assistant, the assistant and the Evra website live
  # on other addresses that differ per home. SVG scenes use inline styles.
  map $server_port $evra_frames {
    8098    "'self'";   # Home Assistant's sidebar shows Evra in a frame from its own address
    default "'none'";   # nobody else may put Evra in a frame
  }

  # Phones, computers and wall panels: http://<this Pi's address>:8099
  server {
    listen 8099 default_server;
    root /var/www/evra;
    index index.html;
    include /etc/nginx/includes/headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $evra_frames" always;
    location ~ /\. { return 404; }
    location = /evra-config.ingress.json { return 404; }
    location / { try_files $uri $uri/ =404; }
  }

  # Home Assistant's sidebar (ingress). Only Home Assistant itself may connect.
  server {
    listen 8098;
    allow 172.30.32.2;
    deny all;
    root /var/www/evra;
    index index.html;
    include /etc/nginx/includes/headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $evra_frames" always;
    location ~ /\. { return 404; }
    location = /evra-config.json { try_files /evra-config.ingress.json =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
